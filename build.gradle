plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.1'
}

group = 'net.voxelarc'
version = '2.0.0'

allprojects {
    apply plugin: 'java'
    apply plugin: 'com.gradleup.shadow'

    group = 'net.voxelarc'
    version = '2.0.0'

    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            name = 'papermc'
            url = 'https://repo.papermc.io/repository/maven-public/'
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/groups/public/"
        }
        maven { url 'https://repo.triumphteam.dev/snapshots/' }
        maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
        maven {
            name = "tcoded-releases"
            url = "https://repo.tcoded.com/releases"
        }
    }

    dependencies {
        compileOnly('org.projectlombok:lombok:1.18.42')
        annotationProcessor 'org.projectlombok:lombok:1.18.42'

        compileOnly 'io.papermc.paper:paper-api:26.1.2.build.+'
        compileOnly 'me.clip:placeholderapi:2.11.7'
    }

    build {
        dependsOn processResources
        dependsOn shadowJar
    }

    def targetJavaVersion = 25
    java {
        def javaVersion = JavaVersion.toVersion(targetJavaVersion)
        sourceCompatibility = javaVersion
        targetCompatibility = javaVersion
        if (JavaVersion.current() < javaVersion) {
            toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
            options.release.set(targetJavaVersion)
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':API')

    compileOnly 'net.luckperms:api:5.4'
    compileOnly 'com.zaxxer:HikariCP:6.3.0'

    implementation 'org.bstats:bstats-bukkit:3.2.1'
    implementation "com.tcoded:FoliaLib:0.5.1"

    implementation ("dev.triumphteam:triumph-cmd-bukkit:2.0.0-SNAPSHOT") { exclude group: "com.google.code.gson" }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

shadowJar {
    dependsOn(jar)

    archiveFileName = "${project.name} v${archiveVersion.get()}.jar"

    relocate 'dev.triumphteam.cmd', 'net.voxelarc.allaychat.libraries.cmd'
    relocate 'org.bstats', 'net.voxelarc.allaychat.libraries.bstats'
    relocate 'com.tcoded.folialib', 'net.voxelarc.allaychat.libraries.folialib'

    from sourceSets.getByName("main").output
    configurations = [project.configurations.getByName("runtimeClasspath")]

}