plugins {
    id 'java'
    id 'maven-publish'
}

group = 'net.voxelarc.allaychat'
version = '1.4.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.2.build.+")
    compileOnly ("dev.triumphteam:triumph-cmd-bukkit:2.0.0-SNAPSHOT") { exclude group: "com.google.code.gson" }
    compileOnly "com.tcoded:FoliaLib:0.5.1"
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            groupId 'net.voxelarc.allaychat'
            artifactId 'api'
        }
    }
    repositories {
        maven {
            name = "voxelarcSnapshots"
            url = uri("https://repo.voxelarc.net/snapshots")
            credentials {
                username = System.getenv("VOXELARC_REPO_USERNAME")
                password = System.getenv("VOXELARC_REPO_PASSWORD")
            }
        }
        maven {
            name = "voxelarcReleases"
            url = uri("https://repo.voxelarc.net/releases")
            credentials {
                username = System.getenv("VOXELARC_REPO_USERNAME")
                password = System.getenv("VOXELARC_REPO_PASSWORD")
            }
        }
    }
}
